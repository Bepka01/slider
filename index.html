<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="slider__container">
        <div class="input__container">
          <p>Кол-во слайдов</p>
          <input class="input value" type="text" />
          <p>Сколько слайдов вращать</p>
          <input class="input slide" type="text" />
          <button class="btn agree">Подтвердить</button>
          <button class="btn delete">Удалить все слайды</button>
        </div>
        <div class="slider__block">
          <div class="slider__wrapper"></div>
        </div>
        <div class="btn__group">
          <button class="btn prev">Назад</button>
          <button class="btn next">Вперед</button>
        </div>
      </div>
    </main>
  </body>
</html>
