<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="slider__container">
        <div class="input__container">
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Кол-во карточек</label
            >
            <input
              type="email"
              class="form-control input value"
              id="exampleFormControlInput1"
              placeholder="Кол-во карточек"
            />
          </div>
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Кол-во свапа</label
            >
            <input
              type="email"
              class="form-control input slide"
              id="exampleFormControlInput1"
              placeholder="Кол-во свапа"
            />
          </div>
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button class="agree btn btn-primary me-md-2" type="button">
              Подтвердить
            </button>
          </div>
        </div>
        <div class="slider__block"></div>
        <div class="btn__group">
          <button type="button" class="btn btn-primary prev">Назад</button>
          <button type="button" class="btn btn-primary next">Вперед</button>
        </div>
      </div>
    </main>
  </body>
</html>
